name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check build output folder
        run: |
          echo "=== Checking output directories ==="
          ls -la
          if [ -d ".output/public" ]; then
            echo "Found .output/public!"
            touch .output/public/.nojekyll
            cp .output/public/index.html .output/public/404.html 2>/dev/null || true
          elif [ -d "dist/client" ]; then
            echo "Found dist/client!"
            touch dist/client/.nojekyll
            cp dist/client/index.html dist/client/404.html 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # هذا هو المجلد الذي يضع فيه Nitro الملفات المولدة مسبقاً (Prerendered)
          path: ".output/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
